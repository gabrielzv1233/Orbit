name: Build Orbit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Orbit
        run: ./gradlew build

      - name: Find built JARs
        id: jars
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t normal < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-javadoc.jar' \
              | sort
          )

          mapfile -t sources < <(
            find build/libs -maxdepth 1 -type f -name '*-sources.jar' \
              ! -name '*-dev-sources.jar' \
              | sort
          )

          if [ "${#normal[@]}" -ne 1 ] || [ "${#sources[@]}" -ne 1 ]; then
            echo "Expected exactly one normal JAR and one sources JAR."
            ls -lah build/libs
            exit 1
          fi

          echo "normal=${normal[0]}" >> "$GITHUB_OUTPUT"
          echo "sources=${sources[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Orbit JAR
        uses: actions/upload-artifact@v7
        with:
          name: Orbit
          path: ${{ steps.jars.outputs.normal }}
          archive: false
          if-no-files-found: error

      - name: Upload Orbit sources JAR
        uses: actions/upload-artifact@v7
        with:
          name: Orbit Sources
          path: ${{ steps.jars.outputs.sources }}
          archive: false
          if-no-files-found: error
